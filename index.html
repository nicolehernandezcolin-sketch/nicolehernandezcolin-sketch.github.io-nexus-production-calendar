    const updated=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const out={updated,events:list.sort((a,b)=>a.date.localeCompare(b.date))};
    const r=await fetch(API,{method:"PUT",headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"},body:JSON.stringify({message:msg,content:enc(JSON.stringify(out,null,1)),sha,branch:"main"})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(r.status===409?"Someone else just saved. Try again.":(j.message||"Save failed ("+r.status+")"))}
    setData(out);render();toast("Saved. Everyone sees it within a few minutes.");return true
  }catch(e){alert("Couldn't save: "+e.message);return false}}
function edbar(){$("edbar").innerHTML=EDIT?`<button class="btn pri" id="addb">+ Add event</button><button class="btn" id="rel">Refresh</button><button class="btn" id="lock">Done editing</button><span class="hint">Editing is on. Changes save to the live calendar for everyone.</span>`:`<button class="btn" id="edb">Edit calendar</button>`;

function unlock(){const d=$("dlg");
  d.innerHTML=`<button class="close" id="cx">Close</button><h3>Turn on editing</h3><p class="hint">Paste your Nexus calendar access key. It's saved only in this browser, so you only do this once per device.</p>

  <details style="margin-top:10px"><summary class="hint">How to make an access key</summary><ol class="hint"><li>On github.com, open Settings, then Developer settings, then Personal access tokens, then Fine-grained tokens.</li><li>Generate new token. Repository access: Only select repositories, and pick this calendar's repository.</li><li>Repository permissions: Contents, Read and write. Generate and copy it.</li></ol></details>
  <div class="edbar" style="margin-top:12px"><button class="btn pri" id="go">Unlock</button>${tok()?'<button class="btn del" id="forget">Forget key on this device</button>':""}</div>`;
  $("cx").onclick=()=>d.close();
  $("go").onclick=async()=>{const v=$("tk").value.trim();if(!v)return;ls.set("nx_gh_token",v);try{await apiGet();EDIT=true;d.close();await load();toast("Editing is on")}catch(e){ls.set("nx_gh_token","");alert(e.message)}};
  if(tok())$("forget").onclick=()=>{ls.set("nx_gh_token","");EDIT=false;d.close();render()};
  try{d.showModal()}catch(x){d.setAttribute("open","")}}
